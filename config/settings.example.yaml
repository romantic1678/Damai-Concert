# Damai Ticket Assistant — example settings (monitor / reminder only)
# Copied to settings.yaml on first run if missing. Do not commit secrets.

app:
  name: Damai Ticket Assistant
  mode: monitor_reminder  # never purchase / checkout

monitor:
  poll_interval_seconds: 60  # minimum allowed: 60
  timezone: Asia/Shanghai

database:
  path: data/app.db

logging:
  level: INFO
  console: true
  file: data/logs/app.log
  max_bytes: 1048576
  backup_count: 5

url_allowlist:
  - damai.cn
  - www.damai.cn
  - m.damai.cn
  - detail.damai.cn

events:
  - name: Example Concert Tour 2026
    city: Shanghai
    open_sale_at: "2026-12-01T12:00:00+08:00"
    note: Placeholder only — replace with a real public listing later

notify:
  channels:
    - console
    - logging
    - gui
    - desktop
    - sound
  # Minutes before open_sale_at; include 0 for sale-start. Customizable.
  reminder_offsets_minutes: [10, 1, 0]
  sound_enabled: true
  desktop_enabled: true
  gui_enabled: true
