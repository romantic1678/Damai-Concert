<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Mock Login</title></head>
<body>
  <h1>手动登录（测试页）</h1>
  <form>
    <label>用户名 <input name="user" autocomplete="username"></label>
    <label>密码 <input name="pass" type="password" autocomplete="current-password"></label>
    <button type="button">登录（不会自动提交支付）</button>
  </form>
  <p>本助手不会读取或保存您输入的账号密码。</p>
</body></html>
